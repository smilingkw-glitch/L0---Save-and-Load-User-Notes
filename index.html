<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>L0 - Save and Load User Notes</title>
  </head>
  <body>
    <h1>User Notes</h1>

    <!-- Textarea where user will type notes -->
    <textarea id="notes-area" rows="8" cols="40" placeholder="Type your notes here..."></textarea>
    <br /><br />

    <!-- Button to save notes into localStorage -->
    <button id="save-btn">Save Notes</button>

    <!-- Button to load notes from localStorage -->
    <button id="load-btn">Load Notes</button>

    <!-- Button to clear notes from localStorage and textarea -->
    <button id="clear-btn">Clear Notes</button>

    <script src="script.js"></script>
  </body>
</html>
